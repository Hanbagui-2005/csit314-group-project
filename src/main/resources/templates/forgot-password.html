<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 400px;">

    <h4 class="mb-1">Forgot your password?</h4>
    <p class="text-muted small mb-4">Enter your email and we'll send you a link to reset it.</p>

    <form method="post" th:action="@{/forgot-password}">

        <div class="mb-4">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com"/>
        </div>

        <button type="submit" class="btn btn-dark w-100">Send reset link</button>

    </form>

</div>
</body>
</html>
