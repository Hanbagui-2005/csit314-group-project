<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Flagged projects')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">

    <h4 class="mb-3">Flagged projects</h4>
    <p class="text-muted small mb-3">PM-11 - reported by customers, or raised automatically by the plagiarism
        check (PM-04).</p>

    <div class="list-group">
        <div class="list-group-item" th:each="flag : ${flags}">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <a th:href="@{/projects/{id}(id=${flag.project.id})}" class="fw-semibold text-decoration-none"
                       th:text="${flag.project.title}">Project</a>
                    <span class="text-muted">
                        reported by
                        <span th:if="${flag.reportedBy != null}" th:text="${flag.reportedBy.fullName}">Customer</span>
                        <span th:if="${flag.reportedBy == null}">the system</span>
                    </span>
                    <span class="badge ms-2"
                          th:classappend="${flag.status.name() == 'OPEN'} ? 'bg-warning text-dark' : (${flag.status.name() == 'REVIEWED'} ? 'bg-success' : 'bg-secondary')"
                          th:text="${flag.status}">Status</span>
                </div>
                <span class="text-muted small" th:text="${#temporals.format(flag.createdAt, 'dd MMM yyyy HH:mm')}">date</span>
            </div>
            <p class="mb-2 mt-2" th:text="${flag.reason}">Reason</p>
            <div th:if="${flag.status.name() == 'OPEN'}" class="d-flex gap-2">
                <form method="post" th:action="@{/platform-manager/flagged-projects/{id}/review(id=${flag.id})}" class="mb-0">
                    <button type="submit" class="btn btn-sm btn-success">Mark reviewed</button>
                </form>
                <form method="post" th:action="@{/platform-manager/flagged-projects/{id}/dismiss(id=${flag.id})}" class="mb-0">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Dismiss</button>
                </form>
            </div>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(flags)}" class="text-muted">No projects have been flagged.</p>

</div>
</body>
</html>
