<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book ' + ${designer.company.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 480px;">

    <h4 class="mb-1">Book a consultation with <span th:text="${designer.company.name}">Studio</span></h4>
    <p class="text-muted small mb-4">A quick chat before you commit to hiring them.</p>

    <form method="post" th:action="@{/designers/{id}/book(id=${designer.id})}">

        <div class="mb-3" th:if="${not #lists.isEmpty(projects)}">
            <label class="form-label">About a specific project? (optional)</label>
            <select name="projectId" class="form-select">
                <option value="" th:selected="${selectedProjectId == null}">General consultation</option>
                <option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.title}"
                        th:selected="${selectedProjectId != null and selectedProjectId == project.id}">
                    Project
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Preferred date</label>
            <input type="date" name="preferredDate" class="form-control"/>
        </div>

        <div class="mb-4">
            <label class="form-label">Notes (optional)</label>
            <textarea name="notes" class="form-control" rows="4"
                      placeholder="Anything they should know before the call"></textarea>
        </div>

        <button type="submit" class="btn btn-dark w-100">Request booking</button>

    </form>

</div>
</body>
</html>
