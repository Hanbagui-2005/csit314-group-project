<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('IDP categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">

    <h4 class="mb-3">Interior Design Project categories</h4>

    <form method="post" th:action="@{/platform-manager/categories}" class="row g-2 mb-4" style="max-width: 500px;">
        <div class="col-8">
            <input type="text" name="name" class="form-control" placeholder="New category name" maxlength="60"/>
        </div>
        <div class="col-4">
            <button type="submit" class="btn btn-dark w-100">Add category</button>
        </div>
    </form>

    <table class="table table-hover align-middle" style="max-width: 700px;">
        <thead>
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.name}">Category</td>
            <td>
                <div class="d-flex gap-2">
                    <form method="post" th:action="@{'/platform-manager/categories/' + ${category.id} + '/rename'}"
                          class="d-flex gap-2">
                        <input type="text" name="name" class="form-control form-control-sm" th:value="${category.name}" maxlength="60"/>
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Rename</button>
                    </form>
                    <form method="post" th:action="@{'/platform-manager/categories/' + ${category.id} + '/delete'}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(categories)}" class="text-muted">No categories yet.</p>

</div>
</body>
</html>
