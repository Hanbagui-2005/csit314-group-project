<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Designer quality')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">

    <h4 class="mb-3">Designer quality overview</h4>
    <p class="text-muted small mb-3">Sorted by dispute rate, highest first.</p>

    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Designer</th>
            <th>Complaints</th>
            <th>Bookings</th>
            <th>Cancelled</th>
            <th>Dispute rate</th>
            <th>Cancellation rate</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="summary : ${summaries}">
            <td th:text="${summary.designer.company.name}">Studio</td>
            <td th:text="${summary.complaintCount}">0</td>
            <td th:text="${summary.totalBookings}">0</td>
            <td th:text="${summary.cancelledBookings}">0</td>
            <td th:text="${summary.disputeRate != null ? #numbers.formatDecimal(summary.disputeRate * 100, 1, 1) + '%' : '-'}">-</td>
            <td th:text="${summary.cancellationRate != null ? #numbers.formatDecimal(summary.cancellationRate * 100, 1, 1) + '%' : '-'}">-</td>
            <td>
                <!-- ADM-10 - jumps straight from "this designer has a high dispute rate"
                     to reviewing their actual complaints, instead of scanning every one -->
                <a th:if="${summary.complaintCount > 0}"
                   th:href="@{/admin/complaints(designerId=${summary.designer.id})}"
                   class="btn btn-sm btn-outline-dark">Review complaints</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(summaries)}" class="text-muted">No designers found.</p>

</div>
</body>
</html>
