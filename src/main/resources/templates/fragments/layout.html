<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' - Interior Design Platform'">Interior Design Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="/css/theme.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<th:block th:fragment="navbar">
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/search">Interior Design Platform</a>
        <div class="d-flex gap-3 align-items-center">
            <a class="nav-link" href="/search">Browse</a>
            <a class="nav-link" href="/favourites">Favourites</a>
            <a class="nav-link" href="/bookings">My bookings</a>
            <a class="nav-link" href="/privacy">Privacy</a>
            <a class="nav-link" href="/designer/dashboard">Designer dashboard</a>
            <div class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Admin</a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/admin/users">Users</a></li>
                    <li><a class="dropdown-item" href="/admin/complaints">Complaints</a></li>
                    <li><a class="dropdown-item" href="/admin/quality">Designer quality</a></li>
                    <li><a class="dropdown-item" href="/admin/security">Login security</a></li>
                    <li><a class="dropdown-item" href="/admin/registration-alerts">Registration alerts</a></li>
                </ul>
            </div>
            <div class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Platform</a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/platform-manager/categories">Categories</a></li>
                    <li><a class="dropdown-item" href="/platform-manager/reports">Reports</a></li>
                </ul>
            </div>
            <button th:if="${currentUser == null}" type="button" class="btn btn-outline-dark btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">Log in</button>
            <form th:if="${currentUser != null}" method="post" th:action="@{/logout}" class="d-flex gap-2 align-items-center mb-0">
                <span class="text-muted small" th:text="${currentUser.name}">Name</span>
                <button type="submit" class="btn btn-outline-dark btn-sm">Log out</button>
            </form>
        </div>
    </div>
</nav>

<div class="container" th:if="${errorMessage != null or successMessage != null}">
    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}">Error</div>
    <div th:if="${successMessage != null}" class="alert alert-success" th:text="${successMessage}">Success</div>
</div>

<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">Log in</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="post" th:action="@{/login}">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com"/>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control"/>
                    </div>
                    <p class="text-end mb-3">
                        <a href="/forgot-password" data-bs-dismiss="modal" class="small">Forgot password?</a>
                    </p>
                    <button type="submit" class="btn btn-dark w-100">Log in</button>
                </form>
                <p class="text-center text-muted small mt-3 mb-0">No account yet? <a href="/register" data-bs-dismiss="modal">Register</a></p>
            </div>
        </div>
    </div>
</div>
</th:block>
</body>
</html>
