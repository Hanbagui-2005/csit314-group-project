<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">All registered users</h4>
        <span th:if="${pendingCount > 0}" class="badge bg-warning text-dark" th:text="${pendingCount} + ' pending'">0 pending</span>
    </div>

    <form method="post" id="bulkForm">
        <div class="d-flex gap-2 mb-2">
            <button type="submit" formaction="/admin/users/bulk-approve" class="btn btn-sm btn-success">Approve selected</button>
            <button type="submit" formaction="/admin/users/bulk-suspend" class="btn btn-sm btn-outline-danger">Suspend selected</button>
        </div>

        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th></th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>License</th>
                <th>Verified</th>
                <th>Risk</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td><input type="checkbox" name="ids" th:value="${user.id}" form="bulkForm"/></td>
                <td th:text="${user.name}">Name</td>
                <td th:text="${user.email}">Email</td>
                <td th:text="${user.role}">Role</td>
                <td>
                    <span class="badge"
                          th:text="${user.status}"
                          th:classappend="${user.status == 'Active'} ? 'bg-success' : (${user.status == 'Pending'} ? 'bg-warning text-dark' : 'bg-secondary')">
                        Status
                    </span>
                    <span class="badge bg-danger" th:if="${user.locked}">Locked</span>
                </td>
                <td th:text="${user.licenseNumber != null ? user.licenseNumber : '-'}">-</td>
                <td>
                    <span th:if="${user.verified != null and user.verified}" class="badge bg-info text-dark">Verified</span>
                    <span th:if="${user.verified != null and !user.verified}" class="badge bg-light text-dark border">Unverified</span>
                </td>
                <td th:text="${user.riskScore != null ? user.riskScore : '-'}">-</td>
                <td>
                    <div class="d-flex gap-2 flex-wrap">
                        <div th:if="${user.status == 'Pending' and user.role == 'Interior Designer'}" class="d-flex gap-2">
                            <form method="post" th:action="@{'/admin/users/' + ${user.id} + '/approve'}">
                                <button type="submit" class="btn btn-sm btn-success">Approve</button>
                            </form>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal" th:attr="data-bs-target='#rejectModal-' + ${user.id}">
                                Reject
                            </button>
                        </div>
                        <form method="post" th:if="${user.status == 'Active' and user.role != 'User Admin'}" th:action="@{'/admin/users/' + ${user.id} + '/suspend'}">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Suspend</button>
                        </form>
                        <form method="post" th:if="${user.status == 'Suspended'}" th:action="@{'/admin/users/' + ${user.id} + '/reactivate'}">
                            <button type="submit" class="btn btn-sm btn-outline-success">Reactivate</button>
                        </form>
                        <form method="post" th:if="${user.locked}" th:action="@{'/admin/users/' + ${user.id} + '/unlock'}">
                            <button type="submit" class="btn btn-sm btn-outline-dark">Unlock</button>
                        </form>
                        <form method="post" th:if="${user.verified != null}" th:action="@{'/admin/users/' + ${user.id} + '/toggle-verified'}">
                            <button type="submit" class="btn btn-sm btn-outline-info"
                                    th:text="${user.verified} ? 'Unverify' : 'Verify'">Verify</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </form>

    <p th:if="${#lists.isEmpty(users)}" class="text-muted">No users found.</p>

    <div th:each="user : ${users}" th:if="${user.status == 'Pending'}"
         class="modal fade" th:id="'rejectModal-' + ${user.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reject <span th:text="${user.name}">name</span>'s registration</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form method="post" th:action="@{'/admin/users/' + ${user.id} + '/reject'}">
                        <label class="form-label">Reason</label>
                        <textarea name="reason" class="form-control mb-3" rows="3"
                                  placeholder="Let them know why their application wasn't approved"></textarea>
                        <button type="submit" class="btn btn-danger w-100">Confirm rejection</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
