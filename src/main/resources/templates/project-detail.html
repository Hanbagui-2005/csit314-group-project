<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Project detail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 720px;">

    <img th:src="${project.imageUrl}" class="img-fluid rounded mb-3" alt="Project photo"/>

    <div class="d-flex justify-content-between align-items-start">
        <h3 th:text="${project.title}">Project title</h3>
        <form method="post" th:action="@{/favourites/add}">
            <input type="hidden" name="projectId" th:value="${project.id}"/>
            <button type="submit" class="btn btn-outline-danger">Save to favourites</button>
        </form>
    </div>

    <span class="badge bg-light text-dark border mb-3" th:text="${project.category}">Category</span>

    <p th:text="${project.description}">Project description goes here.</p>

    <div class="d-flex align-items-center gap-2 mt-4 pt-3 border-top">
        <div class="rounded-circle bg-secondary-subtle" style="width:32px;height:32px;"></div>
        <a th:href="@{/designers/{id}(id=${project.designerId})}" th:text="${project.designerName}"
           class="text-decoration-none fw-semibold">Designer name</a>
    </div>

</div>
</body>
</html>
