<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Project detail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 720px;">

    <img th:src="${project.photoUrls[0]}" class="img-fluid rounded mb-3" alt="Project photo"/>

    <div class="d-flex justify-content-between align-items-start">
        <h3 th:text="${project.title}">Project title</h3>
        <form th:if="${currentUser != null and not isShortlisted}" method="post" th:action="@{/favourites/add}">
            <input type="hidden" name="projectId" th:value="${project.id}"/>
            <button type="submit" class="btn btn-outline-danger">Save to favourites</button>
        </form>
        <form th:if="${currentUser != null and isShortlisted}" method="post" th:action="@{/favourites/remove}">
            <input type="hidden" name="projectId" th:value="${project.id}"/>
            <button type="submit" class="btn btn-danger">Saved - remove</button>
        </form>
    </div>

    <span class="badge bg-light text-dark border mb-3" th:text="${project.category.name}">Category</span>

    <p th:text="${project.description}">Project description goes here.</p>

    <div class="d-flex align-items-center justify-content-between gap-2 mt-4 pt-3 border-top">
        <div class="d-flex align-items-center gap-2">
            <div class="rounded-circle bg-secondary-subtle" style="width:32px;height:32px;"></div>
            <a th:href="@{/designers/{id}(id=${project.designer.id})}" class="text-decoration-none fw-semibold"
               th:text="${project.designer.company.name}">Designer name</a>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/designers/{id}/contact(id=${project.designer.id}, projectId=${project.id})}"
               class="btn btn-sm btn-outline-dark">Message designer</a>
            <a th:href="@{/designers/{id}/book(id=${project.designer.id}, projectId=${project.id})}"
               class="btn btn-sm btn-dark">Book consultation</a>
        </div>
    </div>

</div>
</body>
</html>
