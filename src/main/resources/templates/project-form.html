<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Edit project' : 'New project')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 560px;">

    <h4 class="mb-3" th:text="${isEdit} ? 'Edit project' : 'New project'">New project</h4>

    <form method="post" enctype="multipart/form-data"
          th:action="${isEdit} ? @{/designer/projects/{id}(id=${projectId})} : @{/designer/projects}">

        <!-- IDR-07 - existing photos are shown read-only; new uploads get appended to them -->
        <div class="mb-3" th:if="${isEdit}">
            <label class="form-label">Current photos</label>
            <div class="d-flex flex-wrap gap-2">
                <img th:each="url : ${project.photoUrls}" th:src="${url}" alt="Existing photo"
                     style="width:64px;height:64px;object-fit:cover;border-radius:6px;"/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="${isEdit} ? 'Add more photos' : 'Photos'">Photos</label>
            <input type="file" name="photos" class="form-control" accept="image/*" multiple/>
            <div class="form-text" th:text="${isEdit} ? 'Optional, up to 10 total.' : 'Add at least one photo, up to 10.'">
                Add at least one photo, up to 10.
            </div>
        </div>

        <div class="mb-3" th:if="${isEdit and not #lists.isEmpty(project.beforePhotoUrls)}">
            <label class="form-label">Current before-photos</label>
            <div class="d-flex flex-wrap gap-2">
                <img th:each="url : ${project.beforePhotoUrls}" th:src="${url}" alt="Existing before-photo"
                     style="width:64px;height:64px;object-fit:cover;border-radius:6px;"/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Before photos</label>
            <input type="file" name="beforePhotos" class="form-control" accept="image/*" multiple/>
            <div class="form-text">
                Optional - the "before" shots, so customers can see the actual transformation, up to 10.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="title" name="title" class="form-control"
                   th:value="${isEdit} ? ${project.title} : null" placeholder="e.g. Modern minimalist kitchen"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="description" name="description" class="form-control" rows="4"
                      th:text="${isEdit} ? ${project.description} : null"
                      placeholder="Describe the project"></textarea>
        </div>

        <div class="mb-4">
            <label class="form-label">Category</label>
            <select id="categoryId" name="categoryId" class="form-select">
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                        th:selected="${isEdit and project.category.id == cat.id}">Category</option>
            </select>
            <!-- IDR-06 - shown once we get a suggestion back, hidden otherwise -->
            <div id="categorySuggestion" class="form-text" style="display: none;">
                Looks like this could be <strong id="categorySuggestionName"></strong> —
                <a href="#" id="applyCategorySuggestion">use this category</a>?
            </div>
        </div>

        <!-- IDR-14 - both optional, so customers can gauge fit before reaching out -->
        <div class="mb-3">
            <label class="form-label">Budget range</label>
            <div class="row g-2">
                <div class="col">
                    <input type="number" name="budgetMin" class="form-control" min="0" placeholder="Min"
                           th:value="${isEdit} ? ${project.budgetMin} : null"/>
                </div>
                <div class="col">
                    <input type="number" name="budgetMax" class="form-control" min="0" placeholder="Max"
                           th:value="${isEdit} ? ${project.budgetMax} : null"/>
                </div>
            </div>
            <div class="form-text">Optional - fill in both or leave both blank.</div>
        </div>

        <div class="mb-4">
            <label class="form-label">Estimated timeline</label>
            <input type="text" name="estimatedTimeline" class="form-control" placeholder="e.g. 4-6 weeks"
                   th:value="${isEdit} ? ${project.estimatedTimeline} : null"/>
            <div class="form-text">Optional.</div>
        </div>

        <button type="submit" class="btn btn-dark">Save</button>
        <a href="/designer/dashboard" class="btn btn-outline-secondary">Cancel</a>

    </form>

</div>

<script th:inline="javascript">
    // IDR-06 - as the designer types the title/description, ask the server for a
    // category suggestion and show it as a hint they can click to apply
    (function () {
        const titleInput = document.getElementById('title');
        const descriptionInput = document.getElementById('description');
        const categorySelect = document.getElementById('categoryId');
        const suggestionBox = document.getElementById('categorySuggestion');
        const suggestionName = document.getElementById('categorySuggestionName');
        const applyLink = document.getElementById('applyCategorySuggestion');

        let suggestedCategoryId = null;
        let debounceTimer = null;

        function fetchSuggestion() {
            const title = titleInput.value.trim();
            const description = descriptionInput.value.trim();
            if (!title && !description) {
                suggestionBox.style.display = 'none';
                return;
            }
            const params = new URLSearchParams({title: title, description: description});
            fetch('/designer/projects/suggest-category?' + params.toString())
                .then(response => response.json())
                .then(data => {
                    if (!data.categoryId) {
                        suggestionBox.style.display = 'none';
                        return;
                    }
                    suggestedCategoryId = data.categoryId;
                    suggestionName.textContent = data.categoryName;
                    suggestionBox.style.display = 'block';
                })
                .catch(() => suggestionBox.style.display = 'none');
        }

        function onInputChanged() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(fetchSuggestion, 500);
        }

        titleInput.addEventListener('input', onInputChanged);
        descriptionInput.addEventListener('input', onInputChanged);

        applyLink.addEventListener('click', function (event) {
            event.preventDefault();
            if (suggestedCategoryId) {
                categorySelect.value = suggestedCategoryId;
            }
            suggestionBox.style.display = 'none';
        });
    })();
</script>

</body>
</html>
