spring.application.name=interior-design-platform

# Reload templates without restarting while developing
spring.thymeleaf.cache=false

# MySQL - override with env vars (DB_URL, DB_USERNAME, DB_PASSWORD) if your local setup differs
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interior_design_platform?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Login sessions expire after 30 minutes of inactivity
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Default User Admin account, created on startup if no admin exists yet
app.admin.name=Platform Admin
app.admin.email=${ADMIN_EMAIL:admin@platform.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Password reset links are valid for this many minutes
app.password-reset.expiry-minutes=30
app.base-url=${APP_BASE_URL:http://localhost:8080}

# IDR-05: where uploaded project photos are saved on disk, and the size limits for them
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
